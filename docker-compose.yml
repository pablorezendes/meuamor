services:
  meuamor:
    image: nginx:alpine
    container_name: meuamor
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
      - proxy
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.meuamor.rule=Host(`meuamor.tarotdajhu.com.br`)"
      - "traefik.http.routers.meuamor.entrypoints=websecure"
      - "traefik.http.routers.meuamor.tls=true"
      - "traefik.http.routers.meuamor.tls.certresolver=le"
      - "traefik.http.services.meuamor.loadbalancer.server.port=80"
      # HTTP -> HTTPS
      - "traefik.http.routers.meuamor-web.rule=Host(`meuamor.tarotdajhu.com.br`)"
      - "traefik.http.routers.meuamor-web.entrypoints=web"
      - "traefik.http.routers.meuamor-web.middlewares=meuamor-redirect"
      - "traefik.http.middlewares.meuamor-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.meuamor-redirect.redirectscheme.permanent=true"

networks:
  traefik:
    external: true
  proxy:
    external: true
