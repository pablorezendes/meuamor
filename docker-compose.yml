services:
  meuamor:
    image: nginx:alpine
    container_name: meuamor
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meuamor.rule=Host(`meuamor.tarotdajhu.com.br`)"
      - "traefik.http.routers.meuamor.entrypoints=websecure"
      - "traefik.http.routers.meuamor.tls=true"
      - "traefik.http.routers.meuamor.tls.certresolver=letsencrypt"
      - "traefik.http.services.meuamor.loadbalancer.server.port=80"

# Ajuste se a sua stack usar nomes diferentes (veja o README):
#   - nome da rede do traefik   (aqui: traefik)
#   - entrypoint https          (aqui: websecure)
#   - certresolver              (aqui: letsencrypt)
networks:
  traefik:
    external: true
