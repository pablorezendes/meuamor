server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # compressão para HTML/CSS/JS
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # fotos: cache de 30 dias no navegador
    location ~* \.(jpg|jpeg|png|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # músicas: cache de 30 dias + suporte a streaming parcial
    location ~* \.(mp3|opus|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # html sempre revalida (pra atualizações chegarem na hora)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
